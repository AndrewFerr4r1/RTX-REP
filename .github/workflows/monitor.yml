name: Monitor RTX

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos
  workflow_dispatch:          # botão para rodar na mão

permissions:
  contents: write

concurrency:                  # impede duas execuções ao mesmo tempo
  group: monitor-rtx
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests curl_cffi

      - name: Rodar monitor
        run: python monitor.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRECO_MAX: "1800"
          TESTE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

      - name: Salvar placas já avisadas
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add vistos.json
          git diff --cached --quiet && exit 0
          git commit -m "atualiza vistos"
          for tentativa in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Não consegui salvar o vistos.json desta vez (não é grave)."
